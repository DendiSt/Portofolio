<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
    <linearGradient id="yt-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#c40028"/>
    </linearGradient>
    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" opacity="0.8"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-yt)" />

  <!-- Code Grid Background Pattern -->
  <g opacity="0.12" fill="#a855f7" font-family="monospace" font-size="12">
    <text x="30" y="40">import googleapiclient.discovery</text>
    <text x="30" y="70">import pandas as pd</text>
    <text x="30" y="100">from textblob import TextBlob</text>
    <text x="30" y="130">def analyze_sentiment(comments):</text>
    <text x="50" y="160">return [TextBlob(c).sentiment.polarity for c in comments]</text>
    <text x="450" y="40">youtube = build('youtube', 'v3', developerKey=API_KEY)</text>
    <text x="450" y="70">request = youtube.commentThreads().list(...)</text>
    <text x="450" y="100">response = request.execute()</text>
  </g>

  <!-- Center Card UI -->
  <g transform="translate(180, 70)">
    <rect width="440" height="280" rx="16" fill="rgba(15, 23, 42, 0.9)" stroke="#a855f7" stroke-width="2"/>
    
    <!-- Header Bar -->
    <rect width="440" height="40" rx="16" fill="rgba(30, 27, 75, 0.8)"/>
    <circle cx="25" cy="20" r="5" fill="#ef4444"/>
    <circle cx="42" cy="20" r="5" fill="#eab308"/>
    <circle cx="59" cy="20" r="5" fill="#22c55e"/>
    <text x="80" y="24" fill="#cbd5e1" font-family="sans-serif" font-size="12" font-weight="bold">YouTube API Crawling &amp; Sentiment Analyzer</text>

    <!-- YouTube Play Icon Badge -->
    <g transform="translate(370, 10)">
      <rect width="36" height="22" rx="6" fill="url(#yt-red)" filter="url(#glow-red)"/>
      <polygon points="15,6 25,11 15,16" fill="#ffffff"/>
    </g>

    <!-- Sentiment Chart Visualization -->
    <!-- Positive Bar -->
    <rect x="50" y="80" width="220" height="22" rx="4" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1"/>
    <rect x="50" y="80" width="160" height="22" rx="4" fill="#22c55e"/>
    <text x="280" y="96" fill="#22c55e" font-family="sans-serif" font-size="12" font-weight="bold">72.8% Positive</text>

    <!-- Neutral Bar -->
    <rect x="50" y="125" width="220" height="22" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    <rect x="50" y="125" width="90" height="22" rx="4" fill="#38bdf8"/>
    <text x="280" y="141" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="bold">18.5% Neutral</text>

    <!-- Negative Bar -->
    <rect x="50" y="170" width="220" height="22" rx="4" fill="rgba(244, 63, 94, 0.2)" stroke="#f43f5e" stroke-width="1"/>
    <rect x="50" y="170" width="40" height="22" rx="4" fill="#f43f5e"/>
    <text x="280" y="186" fill="#f43f5e" font-family="sans-serif" font-size="12" font-weight="bold">8.7% Negative</text>

    <!-- Stats summary -->
    <rect x="30" y="215" width="380" height="45" rx="8" fill="rgba(49, 16, 63, 0.5)" stroke="rgba(168, 85, 247, 0.4)"/>
    <text x="45" y="242" fill="#e9d5ff" font-family="sans-serif" font-size="12">Crawled: <tspan font-weight="bold" fill="#00f3ff">15,420 Comments</tspan> | Speed: <tspan font-weight="bold" fill="#4ade80">500 req/sec</tspan></text>
  </g>

  <!-- Title Banner -->
  <rect x="250" y="370" width="300" height="40" rx="20" fill="url(#yt-red)" filter="url(#glow-red)"/>
  <text x="400" y="395" fill="#ffffff" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="2">YOUTUBE DATA ANALYZER</text>
</svg>
