<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sigana" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b00"/>
      <stop offset="50%" stop-color="#2d1200"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="fire-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4500"/>
      <stop offset="50%" stop-color="#ff8c00"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-sigana)" />

  <!-- Heat Map / Radar Rings -->
  <g transform="translate(400, 210)" opacity="0.3">
    <circle r="160" fill="none" stroke="#ff4500" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle r="110" fill="none" stroke="#ff8c00" stroke-width="1.5"/>
    <circle r="60" fill="none" stroke="#ffd700" stroke-width="2"/>
    <line x1="-180" y1="0" x2="180" y2="0" stroke="#ff8c00" stroke-width="1"/>
    <line x1="0" y1="-180" x2="0" y2="180" stroke="#ff8c00" stroke-width="1"/>
  </g>

  <!-- Fire Warning Shield Central Icon -->
  <g transform="translate(400, 185)" filter="url(#glow-orange)">
    <!-- Hexagon -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35" fill="rgba(40, 10, 0, 0.85)" stroke="#ff4500" stroke-width="4"/>
    <!-- Flame Symbol -->
    <path d="M0 -35 C15 -10 25 10 15 30 C5 42 -15 40 -20 25 C-25 10 -15 -15 0 -35 Z" fill="url(#fire-glow)"/>
    <path d="M0 -15 C8 0 15 15 8 25 C2 32 -10 30 -12 20 C-15 10 -8 -5 0 -15 Z" fill="#fff7ed"/>
  </g>

  <!-- Left Telemetry Panel -->
  <g transform="translate(60, 80)">
    <rect width="200" height="260" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#ff4500" stroke-width="1.5"/>
    <text x="20" y="35" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="bold">SI-GANA DETECTORS</text>
    <line x1="20" y1="48" x2="180" y2="48" stroke="#ea580c" stroke-width="1" opacity="0.5"/>
    
    <text x="20" y="80" fill="#94a3b8" font-family="sans-serif" font-size="11">SMOKE SENSOR (MQ-2)</text>
    <text x="20" y="100" fill="#22c55e" font-family="sans-serif" font-size="15" font-weight="bold">NORMAL (42 PPM)</text>

    <text x="20" y="140" fill="#94a3b8" font-family="sans-serif" font-size="11">FLAME SENSOR (IR)</text>
    <text x="20" y="160" fill="#22c55e" font-family="sans-serif" font-size="15" font-weight="bold">NO FLAME DETECTED</text>

    <text x="20" y="200" fill="#94a3b8" font-family="sans-serif" font-size="11">TEMP &amp; HUMIDITY</text>
    <text x="20" y="220" fill="#eab308" font-family="sans-serif" font-size="15" font-weight="bold">32°C / 65% RH</text>
  </g>

  <!-- Right Alert Notification Panel -->
  <g transform="translate(540, 80)">
    <rect width="200" height="260" rx="12" fill="rgba(15, 23, 42, 0.85)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="35" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">INSTANT NOTIF</text>
    <line x1="20" y1="48" x2="180" y2="48" stroke="#0284c7" stroke-width="1" opacity="0.5"/>

    <rect x="15" y="65" width="170" height="50" rx="6" fill="rgba(2, 132, 199, 0.2)" stroke="#0284c7" stroke-width="1"/>
    <text x="25" y="86" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="bold">FIREBASE CLOUD</text>
    <text x="25" y="102" fill="#7dd3fc" font-family="sans-serif" font-size="10">Connected Sync Realtime</text>

    <rect x="15" y="130" width="170" height="50" rx="6" fill="rgba(34, 197, 94, 0.2)" stroke="#22c55e" stroke-width="1"/>
    <text x="25" y="151" fill="#dcfce7" font-family="sans-serif" font-size="11" font-weight="bold">NEXT.JS DASHBOARD</text>
    <text x="25" y="167" fill="#86efac" font-family="sans-serif" font-size="10">Status: Safe Zone A</text>
  </g>

  <!-- Title Banner -->
  <rect x="260" y="370" width="280" height="40" rx="20" fill="url(#fire-glow)" filter="url(#glow-orange)"/>
  <text x="400" y="395" fill="#0f172a" font-family="sans-serif" font-size="15" font-weight="900" text-anchor="middle" letter-spacing="2">SI-GANA FIRE MITIGATION</text>
</svg>
