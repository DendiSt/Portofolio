<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sigana2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#31100e"/>
      <stop offset="100%" stop-color="#180e04"/>
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-sigana2)"/>

  <!-- Mobile App Mockup center -->
  <g transform="translate(280, 50)">
    <rect width="240" height="340" rx="24" fill="#020617" stroke="#f97316" stroke-width="3"/>
    <!-- Phone Notch -->
    <rect x="80" y="10" width="80" height="15" rx="7" fill="#1e293b"/>

    <!-- App Screen -->
    <text x="30" y="60" fill="#f97316" font-family="sans-serif" font-size="14" font-weight="bold">SI-GANA MOBILE</text>
    
    <!-- Status Card -->
    <rect x="25" y="80" width="190" height="80" rx="10" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="40" y="105" fill="#f87171" font-family="sans-serif" font-size="11" font-weight="bold">DETEKSI ALERT</text>
    <text x="40" y="125" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Asap Terdeteksi: 120 PPM</text>
    <text x="40" y="145" fill="#fca5a5" font-family="sans-serif" font-size="10">Lokasi: Ruang Server Lt 2</text>

    <!-- Emergency Button -->
    <rect x="25" y="180" width="190" height="45" rx="10" fill="#ef4444"/>
    <text x="120" y="208" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">EVAKUASI / ALARM ON</text>
  </g>

  <!-- Banner -->
  <rect x="250" y="400" width="300" height="30" rx="15" fill="url(#orange-glow)"/>
  <text x="400" y="420" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">MOBILE ALERT NOTIFICATION</text>
</svg>
