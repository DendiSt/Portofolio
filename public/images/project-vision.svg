<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vision" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#001f54"/>
      <stop offset="100%" stop-color="#034078"/>
    </linearGradient>
    <linearGradient id="grid-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(0, 243, 255, 0.05)"/>
      <stop offset="50%" stop-color="rgba(0, 243, 255, 0.4)"/>
      <stop offset="100%" stop-color="rgba(0, 243, 255, 0.05)"/>
    </linearGradient>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-vision)" />
  
  <!-- Cyber Grid Overlay -->
  <g opacity="0.15">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="#00f3ff" stroke-width="1"/>
    <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="#00f3ff" stroke-width="1"/>
  </g>

  <!-- Water Wave / Fish Pond Visualization -->
  <path d="M 0 320 Q 200 280 400 320 T 800 320 L 800 450 L 0 450 Z" fill="rgba(0, 243, 255, 0.15)"/>
  <path d="M 0 350 Q 200 380 400 340 T 800 360 L 800 450 L 0 450 Z" fill="rgba(0, 102, 255, 0.25)"/>

  <!-- Camera Vision Target Box HUD -->
  <rect x="250" y="100" width="300" height="200" rx="12" fill="rgba(10, 25, 47, 0.7)" stroke="#00f3ff" stroke-width="2" filter="url(#glow-cyan)" />
  
  <!-- Corner Targeting Reticles -->
  <path d="M240 120 V100 H260 M540 100 H560 V120 M560 280 V300 H540 M260 300 H240 V280" stroke="#00f3ff" stroke-width="4" fill="none"/>
  
  <!-- AI Bounding Box inside feed -->
  <rect x="310" y="140" width="180" height="110" rx="6" fill="rgba(0, 243, 255, 0.1)" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="320" y="132" fill="#00f3ff" font-family="sans-serif" font-size="12" font-weight="bold">TARGET: FISH DETECTED [98.4%]</text>

  <!-- Sensor Indicators -->
  <g transform="translate(60, 120)">
    <rect width="140" height="60" rx="8" fill="rgba(2, 12, 27, 0.8)" stroke="rgba(0, 243, 255, 0.3)"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">WATER TEMP</text>
    <text x="15" y="48" fill="#00f3ff" font-family="sans-serif" font-size="18" font-weight="bold">27.5 °C</text>
  </g>

  <g transform="translate(60, 200)">
    <rect width="140" height="60" rx="8" fill="rgba(2, 12, 27, 0.8)" stroke="rgba(0, 243, 255, 0.3)"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">pH LEVEL</text>
    <text x="15" y="48" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">7.2 (OPTIMAL)</text>
  </g>

  <g transform="translate(600, 120)">
    <rect width="140" height="60" rx="8" fill="rgba(2, 12, 27, 0.8)" stroke="rgba(0, 243, 255, 0.3)"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">FEED DISPENSER</text>
    <text x="15" y="48" fill="#4ade80" font-family="sans-serif" font-size="16" font-weight="bold">● ACTIVE</text>
  </g>

  <g transform="translate(600, 200)">
    <rect width="140" height="60" rx="8" fill="rgba(2, 12, 27, 0.8)" stroke="rgba(0, 243, 255, 0.3)"/>
    <text x="15" y="25" fill="#94a3b8" font-family="sans-serif" font-size="11">ESP32-CAM STREAM</text>
    <text x="15" y="48" fill="#f43f5e" font-family="sans-serif" font-size="16" font-weight="bold">● LIVE 1080P</text>
  </g>

  <!-- Title Badge -->
  <rect x="280" y="370" width="240" height="40" rx="20" fill="url(#neon-cyan)" />
  <text x="400" y="395" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="900" text-anchor="middle" letter-spacing="2">V.I.S.I.O.N IoT SYSTEM</text>
</svg>
