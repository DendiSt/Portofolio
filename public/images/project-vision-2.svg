<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-vision2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-vision2)"/>
  
  <!-- Hardware / Sensor Diagram Grid -->
  <g stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.5" fill="none">
    <rect x="100" y="80" width="260" height="280" rx="12" fill="rgba(15, 23, 42, 0.8)"/>
    <rect x="440" y="80" width="260" height="280" rx="12" fill="rgba(15, 23, 42, 0.8)"/>
  </g>

  <!-- ESP32 Hardware schematic left -->
  <text x="120" y="115" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">ESP32-CAM HARDWARE</text>
  <rect x="130" y="140" width="200" height="120" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="2"/>
  <circle cx="230" cy="200" r="30" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="230" cy="200" r="12" fill="#0284c7"/>
  <text x="175" y="290" fill="#94a3b8" font-family="sans-serif" font-size="12">AI Camera Lens Module</text>

  <!-- Telemetry Graph right -->
  <text x="460" y="115" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">REALTIME FEED ANALYTICS</text>
  <!-- Chart Line -->
  <path d="M 470 260 L 510 220 L 550 240 L 590 170 L 630 190 L 670 140" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="670" cy="140" r="5" fill="#38bdf8"/>
  <text x="470" y="300" fill="#4ade80" font-family="sans-serif" font-size="13" font-weight="bold">Feeding Efficiency: +34%</text>

  <!-- Banner -->
  <rect x="250" y="380" width="300" height="35" rx="17" fill="url(#cyan-glow)"/>
  <text x="400" y="403" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ESP32 &amp; ANALYTICS VIEW</text>
</svg>
