<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-yt2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-yt2)"/>

  <!-- Word Cloud & Analytics Table -->
  <g transform="translate(100, 70)">
    <rect width="600" height="280" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="#a855f7" stroke-width="2"/>
    <text x="30" y="45" fill="#a855f7" font-family="sans-serif" font-size="14" font-weight="bold">TOP KEYWORD WORDCLOUD &amp; SENTIMENT METRICS</text>

    <!-- Word Cloud Mock -->
    <text x="50" y="110" fill="#c084fc" font-family="sans-serif" font-size="24" font-weight="bold">Bagus (842)</text>
    <text x="210" y="100" fill="#38bdf8" font-family="sans-serif" font-size="18">Informatif (610)</text>
    <text x="380" y="120" fill="#4ade80" font-family="sans-serif" font-size="28" font-weight="bold">Mantap (1020)</text>
    
    <text x="70" y="170" fill="#f43f5e" font-family="sans-serif" font-size="16">Kurang (210)</text>
    <text x="200" y="180" fill="#eab308" font-family="sans-serif" font-size="22" font-weight="bold">Tutorial (780)</text>
    <text x="370" y="165" fill="#a855f7" font-family="sans-serif" font-size="19">Keren (540)</text>

    <!-- Data Summary Line -->
    <rect x="30" y="210" width="540" height="40" rx="8" fill="rgba(30, 27, 75, 0.7)"/>
    <text x="45" y="235" fill="#cbd5e1" font-family="sans-serif" font-size="12">Extracted Keywords: <tspan fill="#a855f7" font-weight="bold">1,240 terms</tspan> | Accuracy: <tspan fill="#4ade80" font-weight="bold">94.2%</tspan></text>
  </g>

  <!-- Banner -->
  <rect x="250" y="380" width="300" height="35" rx="17" fill="url(#purple-glow)"/>
  <text x="400" y="403" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">NLP WORDCLOUD VIEW</text>
</svg>
