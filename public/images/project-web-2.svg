<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-web2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg-web2)"/>
  <g transform="translate(100, 50)">
    <rect width="600" height="320" rx="12" fill="rgba(15, 23, 42, 0.95)" stroke="#38bdf8" stroke-width="2"/>
    <text x="30" y="45" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">ANALYTICS &amp; RECAPITULATION REPORTS</text>
    
    <!-- Chart Mock -->
    <rect x="30" y="70" width="540" height="150" rx="8" fill="#1e293b"/>
    <path d="M 50 180 Q 150 100 250 140 T 450 90 L 550 110" fill="none" stroke="#38bdf8" stroke-width="3"/>
    
    <!-- Table Mock -->
    <rect x="30" y="240" width="540" height="60" rx="6" fill="#0f172a"/>
    <text x="45" y="275" fill="#cbd5e1" font-family="sans-serif" font-size="12">Export Status: <tspan fill="#4ade80" font-weight="bold">Periodic PDF / Excel Report Generated</tspan></text>
  </g>

  <rect x="250" y="400" width="300" height="30" rx="15" fill="#0284c7"/>
  <text x="400" y="420" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">OPERATIONAL REPORTS &amp; ANALYTICS</text>
</svg>
